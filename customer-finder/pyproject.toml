[project]
name = "customer-finder"
version = "0.1.0"
description = "帮技术创始人找到产品的真实付费客户渠道"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "praw>=7.7.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
customer-finder = "customer_finder.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
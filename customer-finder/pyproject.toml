[project]
name = "customer-finder"
version = "0.1.0"
description = "自动发现和验证潜在付费客户的 CLI 工具"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "praw>=7.7.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
]

[project.scripts]
customer-finder = "customer_finder.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"